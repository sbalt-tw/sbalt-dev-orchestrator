name: spec

# The specification job runs on every branch and every PR, for ever.
#
# The boundary job is conditional: it enforces "specification-only" only while the BASE
# commit does not yet contain the PR-0 completion marker. The marker is read from the base,
# never from the head, so a pull request cannot declare itself finished in order to escape
# the boundary. Once PR-0 has merged, the base carries the marker, PR-A may legitimately
# add src/, and the boundary stands down while ordinary specification validation continues.
#
# There is no `build` step at this slice: the repository ships no runtime source, so
# `tsc -p tsconfig.build.json` has nothing to compile. It returns with PR-A.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  specification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate the specification
        run: npm run spec:validate

      - name: Tests
        run: npm test

  boundary:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A specification-only PR adds no runtime source, schema or migration
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # The completion marker is read from the BASE commit only.
          if git cat-file -e "$BASE:spec/manifests/invariants.json" 2>/dev/null; then
            echo "The base already carries the PR-0 specification."
            echo "The specification-only boundary does not apply from here on;"
            echo "this PR may legitimately add runtime source."
            exit 0
          fi

          echo "The base does not yet carry PR-0. Enforcing the specification-only boundary."
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "changed files:"
          echo "$changed"

          runtime=$(echo "$changed" | grep -E '^src/|\.sql$|(^|/)migrations?/' || true)
          if [ -n "$runtime" ]; then
            echo "::error::this branch adds runtime source, schema or migration files:"
            echo "$runtime"
            exit 1
          fi

          outside=$(echo "$changed" | grep -vE '^(spec/|tools/spec/|tests/spec/|\.github/workflows/|tsconfig\.json$|package\.json$|README\.md$)' || true)
          if [ -n "$outside" ]; then
            echo "::error::this branch touches paths outside the specification slice:"
            echo "$outside"
            exit 1
          fi

          echo "boundary holds: specification, its validator, its tests and its CI only."
